# AgentProlog overlay for the official DeepSeek Harness web/headless profiles.
# Apply after the shipped bundle layers with `dsh ... --patch <this-file>`.
# The core integration changes exactly one upstream semantic owner: AgentFactory.

- id: agent-loop
  disabled: true

- insert:
    - id: agentprolog-agent-factory
      name: !!js process.env.AGENTPROLOG_DSH_PLUGIN
      inject: [agents, sessions]
      config:
        command: !!js process.env.AGENTPROLOG_SIDECAR
        harness:
          version: 0.1.1-rc.2
          revision: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
