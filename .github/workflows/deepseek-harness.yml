name: DeepSeek Harness bridge

on:
  pull_request:
    paths:
      - "packages/deepseek-harness/**"
      - ".github/workflows/deepseek-harness.yml"
  push:
    branches: [main]
    paths:
      - "packages/deepseek-harness/**"
      - ".github/workflows/deepseek-harness.yml"

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Protocol and lifecycle tests
        working-directory: packages/deepseek-harness
        run: npm test
