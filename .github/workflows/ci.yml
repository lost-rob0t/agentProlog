name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Flake check (pack load, sidecar smoke, mode validation)
        run: nix flake check --print-build-logs
      - name: Build sidecar package
        run: nix build .#agentprolog-sidecar --print-build-logs

  node:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Resolve fixed Harness lockfile, build, and test through the nix toolchain
        run: |
          nix develop -c bash -c '
            set -euo pipefail
            pnpm install --no-frozen-lockfile
            pnpm build
            pnpm test
          '
      - name: Commit regenerated pnpm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already current"
          else
            git commit -m "security: lock fixed DeepSeek Harness release"
            git push origin HEAD:${{ github.head_ref }}
          fi
