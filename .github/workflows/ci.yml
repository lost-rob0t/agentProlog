name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Org documentation integrity and checker unit tests
        run: |
          python3 -B scripts/check-docs.py
          python3 -B -m unittest discover -s test -p 'test_documentation.py'
      - name: Build default package
        run: nix build .#agentProlog --print-build-logs
      - name: Run default app
        run: nix run .#agentProlog -- --help | grep -F 'canonical conversation UI'
