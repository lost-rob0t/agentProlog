name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Build default package
        run: nix build .#agentProlog --print-build-logs
      - name: Run default app
        run: nix run .#agentProlog | grep -F 'AgentProlog runtime ready'
